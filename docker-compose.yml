services:
  postgres:
    image: postgres:16-alpine
    container_name: opkit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: opkit
      POSTGRES_PASSWORD: opkit
      POSTGRES_DB: opkit
    ports:
      - "5432:5432"
    volumes:
      - opkit_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opkit"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: opkit-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  opkit_postgres_data:
